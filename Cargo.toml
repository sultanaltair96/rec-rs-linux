[package]
name = "rec-rs"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A simple, fast, reliable screen and camera recorder for Linux (a port of rec-rs)"
repository = "https://github.com/sultanaltair96/rec-rs-linux"
readme = "README.md"
publish = false

[[bin]]
name = "rec-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
gstreamer = "0.24"
gstreamer-app = "0.24"
# Screen capture (phase 1A): the ScreenCast portal and PipeWire.
ashpd = "0.12"
pipewire = { version = "0.10", features = ["v0_3_44"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync"] }
# Microphone and system audio, and the V4L2/portal camera (phase 1B).
v4l = "0.14"
zune-jpeg = { version = "0.4", default-features = false, features = ["std", "x86"] }
x11rb = { version = "0.14", default-features = false, features = ["randr", "xfixes", "xtest"] }
# The GPU compositor and scaler (phase 1C). The same wgpu version egui-wgpu
# 0.36 uses, so the app shares one device with the compositor (phase 1E).
wgpu = { version = "30", default-features = false, features = ["std", "vulkan", "gles", "wgsl"] }
pollster = "1"
# The app (phase 1E): egui on wgpu, the same versions as upstream.
egui = "0.36.2"
egui-wgpu = { version = "0.36.2", features = ["winit", "wayland", "x11"] }
egui-winit = "0.36.2"
winit = "0.30"
# Tray (StatusNotifierItem) and global hotkeys (XDG GlobalShortcuts portal).
ksni = { version = "0.3", features = ["blocking"] }
futures-util = "0.3"
rfd = "0.18"
# "Check for Updates" against GitHub Releases.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
# Golden image fixtures for the compositor (tests/golden).
png = "0.18"
# Headless UI tests with wgpu snapshots (tests/snapshots).
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }

[profile.release]
debug = 1

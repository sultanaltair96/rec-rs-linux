[package]
name = "rec-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A simple, fast, reliable screen and camera recorder for Linux (a port of rec-rs)"
repository = "https://github.com/sultanaltair96/rec-rs-linux"
readme = "README.md"
publish = false

[[bin]]
name = "rec-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
# Live outputs (phase 1D): RTMPS through rustls (ring provider, so no cmake or
# aws-lc build tools are needed), WHIP through str0m with its pure-Rust crypto
# backend plus ureq's rustls client, and stream keys in the Secret Service.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
ureq = "3"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
debug = 1

[package]
name = "rec-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A simple, fast, reliable screen and camera recorder for Linux (a port of rec-rs)"
repository = "https://github.com/sultanaltair96/rec-rs-linux"
readme = "README.md"
publish = false

[[bin]]
name = "rec-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
gstreamer = "0.24"
gstreamer-app = "0.24"
# The app (phase 1E): egui on wgpu, the same versions as upstream.
egui = "0.36.2"
egui-wgpu = { version = "0.36.2", features = ["winit", "wayland", "x11"] }
egui-winit = "0.36.2"
wgpu = "30"
winit = "0.30"
pollster = "0.4"
# Tray (StatusNotifierItem) and global hotkeys (XDG GlobalShortcuts portal).
ksni = { version = "0.3", features = ["blocking"] }
ashpd = { version = "0.14", default-features = false, features = ["tokio", "global_shortcuts", "settings"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync"] }
futures-util = "0.3"
# X11 fallback for hotkeys; the file dialog via the portal (no GTK).
x11rb = "0.14"
rfd = "0.18"
# "Check for Updates" against GitHub Releases.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }

[profile.release]
debug = 1
